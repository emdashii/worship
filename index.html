<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>worship songs</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<input type="radio" id="theme-light" name="theme" checked hidden />
		<input type="radio" id="theme-dark" name="theme" hidden />
		<div class="theme-switch">
			<label for="theme-light">light</label>
			<label for="theme-dark">dark</label>
		</div>
		<main>
			<div id="content">
				<h1>worship songs</h1>
				<div class="search-container">
					<input type="text" id="searchInput" placeholder="Search songs..." />
				</div>
				<table id="songTable">
					<thead>
						<tr>
							<th id="numberHeader" style="cursor: pointer"># ↕</th>
							<th id="titleHeader" style="cursor: pointer">title ↕</th>
							<th>lyrics</th>
							<th>chords</th>
						</tr>
					</thead>
					<tbody>
						<!-- Table content will be generated by JavaScript -->
					</tbody>
				</table>
				<br />
				<script
					src="https://giscus.app/client.js"
					data-repo="emdashii/worship"
					data-repo-id="R_kgDOMuDmhQ"
					data-category="Announcements"
					data-category-id="DIC_kwDOMuDmhc4CuWU4"
					data-mapping="title"
					data-strict="0"
					data-reactions-enabled="1"
					data-emit-metadata="0"
					data-input-position="top"
					data-theme="gruvbox_dark"
					data-lang="en"
					data-loading="lazy"
					crossorigin="anonymous"
					async></script>
				<footer>
					<p>
						made by
						<a href="https://github.com/emdashii/worship">elliott claus</a>
					</p>
					<p>(note: if worshipchords . com is asking you to pay to view more chords, clear your cookies for that site and it will work again)</p>
				</footer>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
